# ANALYSIS DOCUMENTATION
  - name: dashboard_documentation
    type: analysis
    description: |
      Complete dashboard specification and implementation documentation.
      Includes:
      - Dashboard architecture and strategy
      - Complete metric definitions (180+ metrics)
      - SQL query mappings
      - Visual wireframes and layouts
      - Color standards and design guidelines
      - Implementation checklist (8-week plan)
      - BI tool configuration examples
      - Success criteria and validation
    
    owner:
      name: Analytics Lead
      email: analytics@company.com
    
    depends_on:
      - ref('mart_customers')
      - ref('mart_orders')
      - ref('mart_products')
    
    url: null

  - name: data_model_documentation
    type: analysis
    description: |
      Complete dbt data model documentation.
      Documents the medallion architecture (RAW → STG → INT → MART).
      Includes table/view definitions, column mappings, and business logic.
    
    owner:
      name: Data Engineer
      email: data-eng@company.com
    
    depends_on:
      - ref('mart_customers')
      - ref('mart_orders')
      - ref('mart_products')
      - ref('mart_orders_by_customer')
    
    url: null
