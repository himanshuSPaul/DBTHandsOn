  - name: executive_dashboard_queries
    type: analysis
    description: |
      Production SQL queries powering Executive Dashboard.
      Includes 7 executive-level analyses:
      1. Executive KPI Snapshot
      2. Pareto Analysis
      3. Sales Funnel and Pipeline
      4. Cohort Value Progression
      5. Customer Scorecard
      6. Growth Rate Analysis
      7. Forecast and Projections
    
    owner:
      name: Executive Analytics
